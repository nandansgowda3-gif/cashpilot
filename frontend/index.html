<!doctype html><html lang="en"><head><meta charset="utf-8"><title>CashPilot – Predictive Cash Flow</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#f4f6fb;--cd:#fff;--tx:#172033;--mu:#718096;--ac:#4f46e5;--bd:#e6eaf2;--bad:#dc5353;--ok:#15966a;--wn:#d58a19;--bn:rgba(79,70,229,.13);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
:root[data-theme=dark]{color-scheme:dark;--bg:#0b1220;--cd:#131e30;--tx:#edf2ff;--mu:#9aa9c0;--ac:#8b85ff;--bd:#29374d;--bad:#ff7777;--ok:#48d6a0;--wn:#f2bd62;--bn:rgba(139,133,255,.2)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){color-scheme:dark;--bg:#0b1220;--cd:#131e30;--tx:#edf2ff;--mu:#9aa9c0;--ac:#8b85ff;--bd:#29374d;--bad:#ff7777;--ok:#48d6a0;--wn:#f2bd62;--bn:rgba(139,133,255,.2)}}
*{box-sizing:border-box}html{scroll-padding-top:16px}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.55 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
main{max-width:980px;margin:0 auto;padding:26px 20px 100px}.brand{display:flex;align-items:center;gap:12px;margin-bottom:5px}.brand-mark{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(135deg,#625cf2,#3730a3);color:white;font-size:21px;box-shadow:0 7px 18px rgba(79,70,229,.24)}
h1{font-size:27px;line-height:1.2;margin:0;letter-spacing:-.8px;font-weight:800}#who{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:13px;color:var(--mu)}#who[hidden]{display:none}#who button{border:1px solid var(--bd);background:var(--cd);color:var(--tx);border-radius:9px;padding:7px 12px;font:inherit;font-size:12px;font-weight:650;cursor:pointer}.sub{color:var(--mu);margin:0 0 22px 54px;font-size:13px}
nav{display:flex;gap:8px;overflow-x:auto;padding:8px 2px 14px;margin:0 0 18px;scrollbar-width:thin;border-bottom:1px solid var(--bd)}nav button{flex:none;border:1px solid transparent;background:transparent;color:var(--mu);padding:9px 15px;border-radius:11px;font:inherit;font-size:13px;font-weight:600;line-height:1.2;cursor:pointer;transition:.18s}nav button:hover{background:var(--cd);color:var(--tx);border-color:var(--bd)}nav button.on{background:var(--ac);border-color:var(--ac);color:#fff;box-shadow:0 5px 14px rgba(79,70,229,.2)}
.cd{background:var(--cd);border:1px solid var(--bd);border-radius:17px;padding:20px;margin-bottom:16px;box-shadow:0 4px 18px rgba(20,32,55,.035)}h2{font-size:16px;line-height:1.35;margin:0 0 12px;font-weight:750;letter-spacing:-.25px}.g{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-bottom:16px}.k{background:var(--cd);border:1px solid var(--bd);border-radius:16px;padding:16px;min-width:0}.k b{display:block;font-size:24px;letter-spacing:-.7px;margin-bottom:3px}.k span{font-size:12px;color:var(--mu)}
.bad{color:var(--bad)}.ok{color:var(--ok)}.wn{color:var(--wn)}.mu{color:var(--mu);font-size:13px}.tw{overflow-x:auto;border-radius:10px}table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:11px 9px;border-bottom:1px solid var(--bd);text-align:left;white-space:nowrap}th{color:var(--mu);font-weight:650;background:var(--bg)}td.r,th.r{text-align:right}tr:last-child td{border-bottom:0}
label{display:block;font-size:12px;color:var(--mu);font-weight:650;margin:12px 0 5px}input,select{width:100%;box-sizing:border-box;padding:11px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit;outline:none}input:focus,select:focus{border-color:var(--ac);box-shadow:0 0 0 3px var(--bn)}.btn{margin-top:14px;background:var(--ac);color:#fff;border:0;border-radius:10px;padding:11px 17px;font:inherit;font-size:13px;font-weight:650;cursor:pointer;transition:.18s}.btn:hover{filter:brightness(1.06);transform:translateY(-1px)}.btn.s{background:var(--bg);color:var(--tx);border:1px solid var(--bd)}
svg text{fill:var(--mu);font-size:10px}ul{padding-left:20px;margin:8px 0}li{margin:6px 0}#bf{position:fixed;right:20px;bottom:calc(20px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:19px;border:0;background:linear-gradient(135deg,#625cf2,#3730a3);color:#fff;font-size:25px;box-shadow:0 9px 24px rgba(57,48,163,.35);cursor:pointer;z-index:40}#bp{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));max-width:540px;margin:0 auto;max-height:72vh;display:flex;flex-direction:column;background:var(--cd);border:1px solid var(--bd);border-radius:18px;box-shadow:0 15px 45px rgba(0,0,0,.25);z-index:50}#bp[hidden],#bf[hidden]{display:none}#bh{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--bd)}#bh button{background:none;border:0;color:var(--tx);font-size:18px;cursor:pointer}#bl{overflow-y:auto;flex:1;padding:10px 14px;min-height:120px}.bm{margin:7px 0;padding:10px 13px;border-radius:14px;max-width:90%;white-space:pre-wrap;font-size:14px}.bm.u{background:var(--ac);color:#fff;margin-left:auto}.bm.b{background:var(--bg);border:1px solid var(--bd)}#bc{display:flex;gap:7px;overflow-x:auto;padding:5px 14px}#bc button{flex:none;border:1px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:18px;padding:7px 12px;font:inherit;font-size:12px;cursor:pointer}#bi{display:flex;gap:8px;padding:10px 14px 14px}#bi input{flex:1;min-width:0}#bi .btn{margin:0}
@media(min-width:700px){.g{grid-template-columns:repeat(4,minmax(0,1fr))}}@media(max-width:520px){main{padding:20px 13px 90px}.cd{padding:16px;border-radius:15px}h1{font-size:24px}.sub{margin-left:0;margin-top:7px}.k{padding:13px}.k b{font-size:20px}nav{gap:5px}nav button{padding:9px 12px}}
</style></head><body><main>
<div class="brand"><div class="brand-mark">₹</div><h1>CashPilot</h1><div id="who" hidden><span id="wn"></span><button id="lo" type="button">Log out</button></div></div><p class="sub">Your money, clearly organised. Forecast cash flow and stay ahead of spending.</p>
<nav id="nav"></nav><div id="v"></div></main>
<button id="bf" onclick="bTog()" aria-label="Open assistant">🤖</button>
<div id="bp" hidden><div id="bh"><b>CashPilot assistant</b><button onclick="bTog()" aria-label="Close">✕</button></div><div id="bl"></div><div id="bc"><button onclick="bAsk(this.textContent)">Show limits</button><button onclick="bAsk(this.textContent)">What have you learned?</button><button onclick="bAsk(this.textContent)">Am I at risk?</button><button onclick="bAsk(this.textContent)">What do you know about me?</button></div><div id="bi"><input id="bx" placeholder="e.g. set food limit to 4000" onkeydown="if(event.key==='Enter')bSend()"><button class="btn" onclick="bSend()">Send</button></div></div>
<script src="boot.js"></script>
</body></html>
